<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Stream Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 1rem; }
        .progress { height: 25px; background-color: #2c2c2c; }
        .progress-bar { transition: width 0.3s ease; font-weight: bold;}
        .metric-label { font-size: 1.1rem; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Real-Time GPU Engine Usage</h2>
    
    <div class="row" id="metrics-container">
        <div class="col-md-12">
            <div class="card p-3">
                <div class="d-flex justify-content-between mb-1">
                    <span class="metric-label">Render/3D</span>
                    <span id="val-render">0%</span>
                </div>
                <div class="progress">
                    <div id="bar-render" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Video 0</span><span id="val-video0">0%</span></div>
            <div class="progress"><div id="bar-video0" class="progress-bar bg-success" style="width: 0%"></div></div>
        </div></div>

        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Video 1</span><span id="val-video1">0%</span></div>
            <div class="progress"><div id="bar-video1" class="progress-bar bg-success" style="width: 0%"></div></div>
        </div></div>

        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Blitter</span><span id="val-blitter">0%</span></div>
            <div class="progress"><div id="bar-blitter" class="progress-bar bg-warning text-dark" style="width: 0%"></div></div>
        </div></div>

        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Video Enhance 0</span><span id="val-videoenhance0">0%</span></div>
            <div class="progress"><div id="bar-videoenhance0" class="progress-bar bg-info text-dark" style="width: 0%"></div></div>
        </div></div>

        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Video Enhance 1</span><span id="val-videoenhance1">0%</span></div>
            <div class="progress"><div id="bar-videoenhance1" class="progress-bar bg-info text-dark" style="width: 0%"></div></div>
        </div></div>
        
        <div class="col-md-6"><div class="card p-3">
            <div class="d-flex justify-content-between mb-1"><span>Unknown</span><span id="val-unknown">0%</span></div>
            <div class="progress"><div id="bar-unknown" class="progress-bar bg-secondary" style="width: 0%"></div></div>
        </div></div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <h3 class="text-center">Client Stats</h3>
            <div id="client-stats-container" class="mt-3">
                <!-- Client stats will be dynamically updated here -->
            </div>
        </div>
    </div>
</div>

<script>
    const eventSource = new EventSource("/stream-data");

    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        const updateMetric = (key) => {
            const val = data[key] || 0;
            const percentage = val + "%";
            
            document.getElementById(`val-${key}`).innerText = percentage;
            
            document.getElementById(`bar-${key}`).style.width = percentage;
            
            const bar = document.getElementById(`bar-${key}`);
            if(val > 90) bar.classList.add('bg-danger');
            else bar.classList.remove('bg-danger');
        };

        updateMetric('render');
        updateMetric('video0');
        updateMetric('video1');
        updateMetric('blitter');
        updateMetric('videoenhance0');
        updateMetric('videoenhance1');
        updateMetric('unknown');
    };
    
    eventSource.onerror = function() {
        console.log("Connection lost, attempting to reconnect...");
    }

    const clientEventSource = new EventSource("/client-stats");

    clientEventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const container = document.getElementById("client-stats-container");

        Object.entries(data).forEach(([client, stats]) => {
            let clientCard = document.getElementById(`client-${client}`);

            if (!clientCard) {
                clientCard = document.createElement('div');
                clientCard.id = `client-${client}`;
                clientCard.className = 'card p-3 mb-3';
                clientCard.innerHTML = `
                    <h5>${stats.name || 'N/A'} (PID: ${stats.pid || 'N/A'})</h5>
                    <div class="mt-3">
                        ${['Video', 'Video Enhance', 'Render', 'Blitter', 'Unknown'].map(metric => {
                            return `
                                <div class="mb-2">
                                    <div class="d-flex justify-content-between">
                                        <span>${metric}</span>
                                        <span id="val-${client}-${metric}">0%</span>
                                    </div>
                                    <div class="progress">
                                        <div id="bar-${client}-${metric}" class="progress-bar bg-success" role="progressbar" style="width: 0%; transition: width 0.5s ease;"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(clientCard);
            }

            ['Video', 'Video Enhance', 'Render', 'Blitter', 'Unknown'].forEach(metric => {
                const value = stats[metric] || 0;
                const bar = document.getElementById(`bar-${client}-${metric}`);
                const val = document.getElementById(`val-${client}-${metric}`);

                if (bar && val) {
                    val.innerText = `${value}%`;
                    bar.style.width = `${value}%`;

                    if (value > 90) {
                        bar.className = "progress-bar bg-danger";
                    } else if (value > 50) {
                        bar.className = "progress-bar bg-warning";
                    } else {
                        bar.className = "progress-bar bg-success";
                    }
                }
            });
        });

        // Remove cards for clients that are no longer active
        Array.from(container.children).forEach(child => {
            if (!data[child.id.replace('client-', '')]) {
                container.removeChild(child);
            }
        });
    };

    clientEventSource.onerror = function() {
        console.error("Error fetching client stats. Retrying...");
    };
</script>

</body>
</html>
